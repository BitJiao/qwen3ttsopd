[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3tts-opd"
version = "0.2.0"
description = "Instruction SFT and ICL teacher on-policy distillation for Qwen3-TTS Base."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["qwen3opsd*", "qwen3tts_opd*"]
