[project]
name = "qwen3tts-opd"
version = "0.1.0"
description = "On-policy distillation tools for Qwen3-TTS Base."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["qwen3tts_opd*"]
